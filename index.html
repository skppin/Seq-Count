<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seq Completion Tracker</title>

  <style>
    :root {
      --gap: 6px;
      --cell-size: 46px;
      --green: #2ecc71;
      --border: #d0d0d0;
      --highlight: #ff9800;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 20px;
      color: #222;
    }

    header, .filter-section {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stats, .filter-section {
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fafafa;
    }

    .stats {
      display: flex;
      gap: 14px;
    }

    .stat { font-size: 14px; }
    .stat b { font-size: 16px; }

    .action, .pill {
      cursor: pointer;
      border: 1px solid #ddd;
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }

    .action {
      border-radius: 10px;
    }

    .pill.selected {
      background: #fff3e0;
      border-color: var(--highlight);
      box-shadow: 0 0 0 2px rgba(255,152,0,.25);
    }

    .status {
      font-size: 13px;
      color: #555;
    }

    .filter-title {
      font-size: 13px;
      font-weight: 800;
    }

    .boards {
      display: flex;
  gap: 14px;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 14px;
    }

    .board {
      flex: 1 1 520px;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 14px;
  background: #fff;
  overflow-x: auto;
    }

    .board-title {
      margin: 0 0 10px 0;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mini-stats {
      font-size: 13px;
      color: #444;
      padding: 4px 8px;
      border: 1px solid #eee;
      border-radius: 999px;
      background: #fafafa;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      gap: var(--gap);
      width: max-content;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      padding: 4px 2px;
      text-align: center;
      overflow: hidden;
      box-sizing: border-box;
    }

    .cell.green {
      background: var(--green);
      border-color: #25b864;
      color: #0b3a1e;
    }

    .cell.highlighted {
      outline: 3px solid var(--highlight);
      outline-offset: 2px;
    }

    .cell-type,
    .cell-result {
      font-size: 10px;
      line-height: 1;
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .cell-number {
      font-weight: 800;
      font-size: 14px;
      line-height: 1;
    }

    footer {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
    }

    @media (max-width: 650px) {
      :root { --cell-size: 34px; --gap: 5px; }
      body { margin: 12px; }
      .boards { grid-template-columns: 1fr; }
      .cell-number { font-size: 11px; }
      .cell-type, .cell-result { font-size: 7px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="stats">
      <div class="stat">Completed: <b id="completedCount">0</b></div>
      <div class="stat">Remaining: <b id="remainingCount">0</b></div>
      <div class="stat">Total: <b id="totalCount">0</b></div>
    </div>

    <button class="action" id="exportTxtBtn">Export (.txt)</button>
    <button class="action" id="exportCsvBtn">Export (.csv / Excel)</button>
    <button class="action" id="manualSyncBtn">Sync Now</button>

    <span class="status" id="syncStatus">Loading…</span>
    <span class="status" id="lastSync"></span>
  </header>

  <section class="filter-section">
    <span class="filter-title">Result:</span>
    <button class="pill result-filter" data-result="Goal">Goal: <b id="countGoal">0</b></button>
    <button class="pill result-filter" data-result="Miss">Miss: <b id="countMiss">0</b></button>
    <button class="pill result-filter" data-result="Save">Save: <b id="countSave">0</b></button>
    <button class="pill result-filter" data-result="Save Deflect">Save Deflect: <b id="countSaveDeflect">0</b></button>
    <button class="pill result-filter" data-result="Foul">Foul: <b id="countFoul">0</b></button>
  </section>

  <section class="filter-section">
    <span class="filter-title">Type:</span>
    <button class="pill type-filter" data-type="K O">Kick Off</button>
    <button class="pill type-filter" data-type="G K">Goal Kick</button>
    <button class="pill type-filter" data-type="F K">Free Kick</button>
    <button class="pill type-filter" data-type="COR">Corner</button>
    <button class="pill type-filter" data-type="REF">Referee</button>
    <button class="pill type-filter" data-type="P T">Penalty</button>
    <button class="pill type-filter" data-type="N/A">N/A</button>
    <button class="pill" id="clearHighlightBtn">Clear Highlight</button>
  </section>

  <div class="boards">
    <section class="board">
      <h2 class="board-title">Main Sequence <span class="mini-stats">Completed: <b id="mainDone">0</b> | Remaining: <b id="mainRem">240</b></span></h2>
      <div id="mainGrid" class="grid"></div>
    </section>

    <section class="board">
      <h2 class="board-title">Penalty &amp; Referee Sequence <span class="mini-stats">Completed: <b id="prDone">0</b> | Remaining: <b id="prRem">50</b></span></h2>
      <div id="prGrid" class="grid"></div>
    </section>

    <section class="board">
      <h2 class="board-title">Mirror Sequences <span class="mini-stats">Completed: <b id="mirrorDone">0</b> | Remaining: <b id="mirrorRem">240</b></span></h2>
      <div id="mirrorGrid" class="grid"></div>
    </section>

    <section class="board">
      <h2 class="board-title">Flip Sequences <span class="mini-stats">Completed: <b id="flipDone">0</b> | Remaining: <b id="flipRem">240</b></span></h2>
      <div id="flipGrid" class="grid"></div>
    </section>
  </div>

  <footer>
    Auto-sync from <code>./completed/meta.json</code>.
  </footer>

  <script>
    const DEFAULT_TYPE = "N/A";
    const DEFAULT_RESULT = "N/A";
    const META_URL = "./completed/meta.json";

    const CONFIGS = {
      main: { title: "Main Sequence", start: 1, total: 240, cols: 16 },
      pr: { title: "Penalty & Referee Sequence", total: 50, cols: 10 },
      mirror: { title: "Mirror Sequences", start: 1, total: 240, cols: 16 },
      flip: { title: "Flip Sequences", start: 1, total: 240, cols: 16 }
    };

    const GRAND_TOTAL = 770;

    let activeResult = null;
    let activeType = null;

    let state = {
      main: new Map(),
      pr: new Map(),
      mirror: new Map(),
      flip: new Map()
    };

    const ids = id => document.getElementById(id);

    const grids = {
      main: ids("mainGrid"),
      pr: ids("prGrid"),
      mirror: ids("mirrorGrid"),
      flip: ids("flipGrid")
    };

    const mini = {
      main: { done: ids("mainDone"), rem: ids("mainRem") },
      pr: { done: ids("prDone"), rem: ids("prRem") },
      mirror: { done: ids("mirrorDone"), rem: ids("mirrorRem") },
      flip: { done: ids("flipDone"), rem: ids("flipRem") }
    };

    const resultEls = {
      Goal: ids("countGoal"),
      Miss: ids("countMiss"),
      Save: ids("countSave"),
      "Save Deflect": ids("countSaveDeflect"),
      Foul: ids("countFoul")
    };

    ids("totalCount").textContent = GRAND_TOTAL;

    function prValues() {
      const arr = [];
      for (let n = 1001; n <= 1020; n++) arr.push(n);
      for (let n = 2001; n <= 2030; n++) arr.push(n);
      return arr;
    }

    function gridValues(key) {
      if (key === "pr") return prValues();
      const cfg = CONFIGS[key];
      return Array.from({ length: cfg.total }, (_, i) => cfg.start + i);
    }

    function normalizeResult(value) {
      const v = String(value || "").trim().toUpperCase();
      if (v === "SD" || v === "S D" || v === "SAVE DEFLECT") return "Save Deflect";
      if (v === "GOAL") return "Goal";
      if (v === "MISS") return "Miss";
      if (v === "SAVE") return "Save";
      if (v === "FOUL") return "Foul";
      return DEFAULT_RESULT;
    }

    function createCell(num) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.number = num;

      cell.innerHTML = `
        <div class="cell-type">${DEFAULT_TYPE}</div>
        <div class="cell-number">${num}</div>
        <div class="cell-result">${DEFAULT_RESULT}</div>
      `;

      return cell;
    }

    function buildGrids() {
      for (const key of Object.keys(CONFIGS)) {
        grids[key].style.gridTemplateColumns = `repeat(${CONFIGS[key].cols}, var(--cell-size))`;
        grids[key].innerHTML = "";
        const frag = document.createDocumentFragment();
        gridValues(key).forEach(n => frag.appendChild(createCell(n)));
        grids[key].appendChild(frag);
      }
    }

    function cleanMetaEntry(entry) {
      return {
        type: entry && typeof entry.type === "string" && entry.type.trim() ? entry.type.trim() : DEFAULT_TYPE,
        result: entry && typeof entry.result === "string" && entry.result.trim() ? entry.result.trim() : DEFAULT_RESULT
      };
    }

    function resetState() {
      state = {
        main: new Map(),
        pr: new Map(),
        mirror: new Map(),
        flip: new Map()
      };
    }

    function applyMetaSection(key, section) {
      if (!section || typeof section !== "object" || Array.isArray(section)) return;

      for (const [rawNum, entry] of Object.entries(section)) {
        const num = parseInt(rawNum, 10);
        if (!Number.isInteger(num)) continue;

        if (key === "main" && num >= 1 && num <= 240) {
          state.main.set(num, cleanMetaEntry(entry));
        }

        if (key === "main" && ((num >= 1001 && num <= 1020) || (num >= 2001 && num <= 2030))) {
          state.pr.set(num, cleanMetaEntry(entry));
        }

        if ((key === "mirror" || key === "flip") && num >= 1 && num <= 240) {
          state[key].set(num, cleanMetaEntry(entry));
        }
      }
    }

    function renderGrid(key) {
      const values = gridValues(key);

      values.forEach((num, index) => {
        const cell = grids[key].children[index];
        const data = state[key].get(num);
        const done = !!data;
        const type = data ? data.type : DEFAULT_TYPE;
        const result = data ? data.result : DEFAULT_RESULT;
        const normalizedResult = normalizeResult(result);

        cell.classList.toggle("green", done);
        cell.classList.remove("highlighted");

        cell.querySelector(".cell-type").textContent = type;
        cell.querySelector(".cell-result").textContent = result;

        cell.dataset.done = done ? "true" : "false";
        cell.dataset.type = type;
        cell.dataset.result = normalizedResult;

        cell.title = `Sequence: ${num}\nType: ${type}\nResult: ${result}`;
      });
    }

    function renderAll() {
      Object.keys(CONFIGS).forEach(renderGrid);
      updateCounts();
      applyFilters();
    }

    function updateCounts() {
      let completed = 0;

      for (const key of Object.keys(CONFIGS)) {
        const done = state[key].size;
        completed += done;
        mini[key].done.textContent = done;
        mini[key].rem.textContent = CONFIGS[key].total - done;
      }

      ids("completedCount").textContent = completed;
      ids("remainingCount").textContent = GRAND_TOTAL - completed;

      const resultCounts = {
        Goal: 0,
        Miss: 0,
        Save: 0,
        "Save Deflect": 0,
        Foul: 0
      };

      for (const key of Object.keys(CONFIGS)) {
        for (const data of state[key].values()) {
          const r = normalizeResult(data.result);
          if (resultCounts[r] !== undefined) resultCounts[r]++;
        }
      }

      Object.entries(resultCounts).forEach(([k, v]) => {
        resultEls[k].textContent = v;
      });
    }

    function clearSelectedButtons() {
      document.querySelectorAll(".pill.selected").forEach(btn => {
        btn.classList.remove("selected");
      });
    }

    function clearFilters() {
      activeResult = null;
      activeType = null;
      clearSelectedButtons();
      document.querySelectorAll(".cell.highlighted").forEach(c => c.classList.remove("highlighted"));
    }

    function applyFilters() {
      document.querySelectorAll(".cell.highlighted").forEach(c => c.classList.remove("highlighted"));

      if (!activeResult && !activeType) return;

      document.querySelectorAll(".cell").forEach(cell => {
        const done = cell.dataset.done === "true";
        const resultOk = !activeResult || cell.dataset.result === activeResult;
        const typeOk = !activeType || cell.dataset.type === activeType;

        if (done && resultOk && typeOk) {
          cell.classList.add("highlighted");
        }
      });
    }

    function setupFilters() {
      document.querySelectorAll(".result-filter").forEach(btn => {
        btn.addEventListener("click", () => {
          const value = btn.dataset.result;

          document.querySelectorAll(".result-filter").forEach(b => b.classList.remove("selected"));

          if (activeResult === value) {
            activeResult = null;
          } else {
            activeResult = value;
            btn.classList.add("selected");
          }

          applyFilters();
        });
      });

      document.querySelectorAll(".type-filter").forEach(btn => {
        btn.addEventListener("click", () => {
          const value = btn.dataset.type;

          document.querySelectorAll(".type-filter").forEach(b => b.classList.remove("selected"));

          if (activeType === value) {
            activeType = null;
          } else {
            activeType = value;
            btn.classList.add("selected");
          }

          applyFilters();
        });
      });

      ids("clearHighlightBtn").addEventListener("click", clearFilters);
    }

    async function loadFromJson() {
      ids("syncStatus").textContent = "Fetching…";
      ids("manualSyncBtn").disabled = true;

      try {
        clearFilters();

        const res = await fetch(META_URL + "?ts=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error(`meta.json fetch failed: ${res.status}`);

        const meta = await res.json();

        resetState();
        applyMetaSection("main", meta.main);
        applyMetaSection("mirror", meta.mirror);
        applyMetaSection("flip", meta.flip);

        renderAll();

        ids("syncStatus").textContent = "Synced ✓";
        ids("lastSync").textContent = `Last sync: ${new Date().toLocaleString()}`;
      } catch (err) {
        console.error(err);
        ids("syncStatus").textContent = "Sync error";
        alert(`JSON Sync failed.\n\n${err.message || err}`);
      } finally {
        ids("manualSyncBtn").disabled = false;
      }
    }

    function sortedEntries(key) {
      return Array.from(state[key].entries()).sort((a, b) => a[0] - b[0]);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportTxt() {
      const lines = [];

      for (const key of Object.keys(CONFIGS)) {
        lines.push(CONFIGS[key].title);
        sortedEntries(key).forEach(([n, d]) => lines.push(`${n} - ${d.type} - ${d.result}`));
        lines.push("");
      }

      downloadBlob(new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" }), "sequences.txt");
    }

    function exportCsv() {
      const esc = v => String(v || "").replace(/"/g, '""');
      const lines = [];

      for (const key of Object.keys(CONFIGS)) {
        lines.push(CONFIGS[key].title);
        lines.push("BlockNumber,BlockType,BlockResult");
        sortedEntries(key).forEach(([n, d]) => lines.push(`${n},"${esc(d.type)}","${esc(d.result)}"`));
        lines.push("");
      }

      downloadBlob(new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" }), "sequences.csv");
    }

    ids("exportTxtBtn").addEventListener("click", exportTxt);
    ids("exportCsvBtn").addEventListener("click", exportCsv);
    ids("manualSyncBtn").addEventListener("click", loadFromJson);

    buildGrids();
    setupFilters();
    clearFilters();
    loadFromJson();
  </script>
</body>
</html>
